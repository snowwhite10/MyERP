# MyERP CI（MASTER_PROMPT 第 11 節）
# 只跑後端建置 + 單元測試、前端建置 + 測試；整合測試與 E2E 需要本機 SQL Server 2022 / Redis，在 VM 本機執行。
# 不使用任何機密或連線字串。結構由 tests/backend.unit/MyERP.ArchitectureTests/CiWorkflowTests.cs 檢查。
name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  backend:
    name: Backend build + unit tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/backend/MyERP.sln

      - name: Build
        run: dotnet build src/backend/MyERP.sln -c Release --no-restore

      - name: Unit tests (Shared)
        run: dotnet test --project tests/backend.unit/MyERP.Shared.Tests/MyERP.Shared.Tests.csproj -c Release --no-build

      - name: Unit tests (Architecture)
        run: dotnet test --project tests/backend.unit/MyERP.ArchitectureTests/MyERP.ArchitectureTests.csproj -c Release --no-build

  frontend:
    name: Frontend build + tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Unit tests
        run: npx ng test --watch=false
